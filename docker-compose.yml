version: '3.8'

services:
  dashboard:
    build: .
    container_name: neat-dashboard
    ports:
      - "5001:5000"
    volumes:
      # Mount logs directory (read-only for safety)
      - ./logs:/app/logs:ro
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/data')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
